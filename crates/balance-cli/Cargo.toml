[package]
name = "balance-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "balance"
path = "src/main.rs"

[dependencies]
balance-lang = { path = "../balance-lang" }
balance-lsp = { path = "../balance-lsp" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
toml = "0.8"
